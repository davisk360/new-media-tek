<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the hexagon background -->
    <linearGradient id="hexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Drop shadow filter -->
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    
    <!-- Glow effect for text -->
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shield-like hexagon shape -->
  <path d="M 50 8 L 75 20 L 85 45 L 75 80 L 50 92 L 25 80 L 15 45 L 25 20 Z" 
        fill="url(#hexGradient)" 
        filter="url(#dropShadow)"/>
  
  <!-- Inner highlight for embossed effect -->
  <path d="M 50 12 L 71 22 L 79 43 L 71 76 L 50 86 L 29 76 L 21 43 L 29 22 Z" 
        fill="none" 
        stroke="rgba(255,255,255,0.1)" 
        stroke-width="1"/>
  
  <!-- NM text -->
  <text x="50" y="58" 
        font-family="Arial, sans-serif" 
        font-size="28" 
        font-weight="bold" 
        fill="white" 
        text-anchor="middle" 
        filter="url(#textGlow)">NM</text>
  
  <!-- # superscript -->
  <text x="72" y="48" 
        font-family="Arial, sans-serif" 
        font-size="14" 
        font-weight="bold" 
        fill="#60a5fa" 
        text-anchor="middle">#</text>
</svg>
