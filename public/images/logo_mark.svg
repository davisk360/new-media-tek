<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient for hexagon -->
    <linearGradient id="hexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
    
    <!-- Inner glow for depth -->
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feComposite in="coloredBlur" in2="SourceAlpha" operator="over"/>
    </filter>
  </defs>
  
  <!-- Main hexagon shape -->
  <path d="M 100 25 L 160 55 L 160 145 L 100 175 L 40 145 L 40 55 Z" 
        fill="url(#hexGradient)" 
        filter="url(#shadow)"/>
  
  <!-- Inner highlight for embossed effect -->
  <path d="M 100 35 L 150 60 L 150 140 L 100 165 L 50 140 L 50 60 Z" 
        fill="none" 
        stroke="rgba(255,255,255,0.15)" 
        stroke-width="2"
        opacity="0.8"/>
  
  <!-- Subtle inner gradient overlay -->
  <path d="M 100 35 L 150 60 L 150 140 L 100 165 L 50 140 L 50 60 Z" 
        fill="url(#hexGradient)" 
        opacity="0.3"/>
  
  <!-- NM Text -->
  <text x="100" y="115" 
        font-family="Arial, sans-serif" 
        font-size="56" 
        font-weight="bold" 
        fill="white" 
        text-anchor="middle" 
        filter="url(#innerGlow)">NM</text>
  
  <!-- # Symbol (superscript style) -->
  <text x="145" y="95" 
        font-family="Arial, sans-serif" 
        font-size="28" 
        font-weight="bold" 
        fill="#60a5fa" 
        text-anchor="middle">#</text>
  
  <!-- Subtle highlight on top edge -->
  <path d="M 100 25 L 160 55" 
        stroke="rgba(255,255,255,0.2)" 
        stroke-width="1" 
        opacity="0.6"/>
</svg>
